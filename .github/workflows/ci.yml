name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Backend: lint + tests ───────────────────────────────────────────────────
  backend:
    name: Backend — ruff + pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Pull Git LFS objects (model artifact).
          # If LFS is not available, conftest.py SQLite fixture still works for all
          # non-ML tests; ML inference tests are skipped via the LFS guard.
          lfs: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pytest

      - name: Ruff lint check
        run: ruff check backend/app backend/tests --select E,F,W --ignore E501

      - name: Run backend tests (SQLite, no Neon connection)
        working-directory: backend
        env:
          # Force SQLite so tests never touch the Neon Postgres instance
          DATABASE_URL: "sqlite:///./phishguard_ci_test.db"
          COOKIE_SECURE: "false"
          ENVIRONMENT: "development"
          SECRET_KEY: "ci-test-secret-key-minimum-32-bytes-long"
        run: python -m pytest -q --tb=short

  # ── Frontend: type-check + build ────────────────────────────────────────────
  frontend:
    name: Frontend — tsc + build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc -b --noEmit

      - name: Run frontend tests (Vitest)
        working-directory: frontend
        run: npm run test:run

      - name: Production build
        working-directory: frontend
        run: npm run build

