name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Backend: lint + tests ───────────────────────────────────────────────────
  backend:
    name: Backend — ruff + pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Pull Git LFS objects (model artifact).
          # If Git LFS objects are unavailable or bandwidth quota is exceeded,
          # checkout leaves the pointer stub in place; conftest.py detects the
          # pointer and skips ML-dependent tests while allowing all other tests to pass.
          lfs: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pytest

      - name: Ruff lint check
        run: ruff check backend/app backend/tests --select E,F,W --ignore E501

      - name: Verify Git LFS model artifact
        working-directory: backend
        run: |
          python -c "
          import os
          model_path = 'app/ml/artifacts/phishguard_rf_model.joblib'
          if not os.path.exists(model_path):
              print('::warning::ML model artifact missing at ' + model_path + '. ML tests will be skipped.')
          else:
              with open(model_path, 'rb') as f:
                  header = f.read(30)
              if header.startswith(b'version https://git-lfs'):
                  print('::warning::ML model artifact is a Git LFS pointer. Run git lfs pull to fetch real binary. ML tests will be skipped.')
              else:
                  size_mb = os.path.getsize(model_path) / (1024 * 1024)
                  print(f'::notice::Real ML model artifact verified: {size_mb:.2f} MB')
          "

      - name: Run backend tests (SQLite, no Neon connection)
        working-directory: backend
        env:
          # Force SQLite so tests never touch the Neon Postgres instance
          DATABASE_URL: "sqlite:///./phishguard_ci_test.db"
          COOKIE_SECURE: "false"
          ENVIRONMENT: "development"
          SECRET_KEY: "ci-test-secret-key-minimum-32-bytes-long"
        run: python -m pytest -q --tb=short

  # ── Frontend: type-check + build ────────────────────────────────────────────
  frontend:
    name: Frontend — tsc + build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc -b --noEmit

      - name: Run frontend tests (Vitest)
        working-directory: frontend
        run: npm run test:run

      - name: Production build
        working-directory: frontend
        run: npm run build

