<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Outer glow for shield -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Subtle inner glow on shield -->
    <linearGradient id="shieldGrad" x1="32" y1="4" x2="32" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <!-- Green accent gradient -->
    <linearGradient id="greenGrad" x1="20" y1="28" x2="44" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#39FF88"/>
      <stop offset="100%" stop-color="#16C96A"/>
    </linearGradient>
  </defs>

  <!-- Background circle (rounded square feel) -->
  <rect width="64" height="64" rx="14" fill="#0A0A0A"/>

  <!-- Shield body -->
  <path
    d="M32 6 L52 14 L52 32 C52 43.5 43 53.5 32 58 C21 53.5 12 43.5 12 32 L12 14 Z"
    fill="url(#shieldGrad)"
    stroke="#39FF88"
    stroke-width="1.8"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Shield inner border highlight (top-left rim) -->
  <path
    d="M32 9 L50 16.5 L50 32 C50 42 42 51 32 55.5"
    stroke="#39FF88"
    stroke-width="0.5"
    stroke-linecap="round"
    opacity="0.35"
    fill="none"
  />

  <!-- Checkmark (tick) - bold, centered in shield -->
  <polyline
    points="21,33 28,41 43,24"
    stroke="url(#greenGrad)"
    stroke-width="4.2"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    filter="url(#glow)"
  />
</svg>
