version: '3.8'

volumes:
  # Named volume for SQLite database — avoids creating an empty directory
  # when the file does not yet exist (which a bare bind-mount would do).
  phishguard-db-data:

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: phishguard-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:80}
      - DATABASE_URL=${DATABASE_URL:-sqlite:////data/phishguard.db}
      - GOOGLE_SAFE_BROWSING_API_KEY=${GOOGLE_SAFE_BROWSING_API_KEY:-}
      - URLHAUS_AUTH_KEY=${URLHAUS_AUTH_KEY:-}
      - ENABLE_THIRD_PARTY_LOOKUPS=${ENABLE_THIRD_PARTY_LOOKUPS:-true}
    volumes:
      - phishguard-db-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: phishguard-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
