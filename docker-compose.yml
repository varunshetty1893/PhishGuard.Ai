version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: phishguard-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - COOKIE_SECURE=false
      - DATABASE_URL=sqlite:///./phishguard.db
      - URLHAUS_AUTH_KEY=${URLHAUS_AUTH_KEY:-}
      - GOOGLE_SAFE_BROWSING_API_KEY=${GOOGLE_SAFE_BROWSING_API_KEY:-}
    volumes:
      - ./backend/phishguard.db:/app/phishguard.db
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: phishguard-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
